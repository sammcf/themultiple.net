<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/blog/feed.xml' | absolute_url }}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/bricolage-grotesque-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="masthead">
    <a class="wordmark" href="/" aria-label="the Multiple, all projects"><span class="art">the</span>Multiple</a>
    <div class="menu">
      <nav class="apps" aria-label="Blog">
        <a aria-current="page" href="/blog/">Blog</a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="impression">
    <div class="rail">
      <svg class="monogram" viewBox="8 0 78 100" role="img" aria-label="the Multiple">
        <path d="M74 16H18l24 34-24 34h56"/>
        <ellipse cx="60" cy="50" rx="15" ry="21"/>
        <path d="M60 6v5"/>
        <path d="M60 21v73"/>
      </svg>
    </div>
    <dl>
      <dt>feed</dt><dd><a href="/blog/feed.xml">Atom</a></dd>
      <dt>this page</dt><dd>generated from Markdown · no script · no cookies · no analytics</dd>
      <dt>contact</dt><dd><a href="mailto:sam@themultiple.net">sam@themultiple.net</a></dd>
      <dt>elsewhere</dt><dd><a href="/">all projects</a></dd>
    </dl>
  </footer>
</body>
</html>
