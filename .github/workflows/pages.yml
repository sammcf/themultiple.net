name: Publish to Pages

# The repository is not the site. scripts/assemble-site.sh decides what is
# published, from a manifest, and this workflow deploys only what it assembles —
# so the design system specimen and the strip harness can live in the repository
# without ever reaching themultiple.net.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Ensure ripgrep
        run: command -v rg || { sudo apt-get update && sudo apt-get install -y ripgrep; }

      - name: Build and validate the served site
        run: bash scripts/build-site.sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
