name: Validate static site

# On main the same checks run inside the publish workflow, ahead of the deploy,
# so this one guards pull requests only.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure ripgrep
        run: command -v rg || { sudo apt-get update && sudo apt-get install -y ripgrep; }

      - name: Run static checks
        run: bash scripts/check-site.sh
